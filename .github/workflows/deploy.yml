name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install App Dependencies
        run: npm ci

      - name: Build App
        run: npm run build

      - name: Install Infra Dependencies
        run: |
          cd infra
          npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy with CDK
        env:
          # Custom domain + ACM cert (cert must be in us-east-1 for CloudFront).
          # Set these as repository Variables; the ARN is not a secret.
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
          # Verified SES identities for the contact form.
          CONTACT_SENDER: ${{ vars.CONTACT_SENDER }}
          CONTACT_RECIPIENT: ${{ vars.CONTACT_RECIPIENT }}
        run: |
          cd infra
          npx cdk deploy --require-approval never
